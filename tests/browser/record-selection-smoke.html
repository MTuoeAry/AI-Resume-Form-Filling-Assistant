<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>指定经历选填验收 · 虚构表单</title>
<style>
body { font: 15px/1.6 system-ui; max-width: 760px; margin: 32px auto; padding: 0 24px; color: #1e293b; }
article { border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; margin: 16px 0; }
label { display: block; margin: 10px 0; }
input, textarea { display: block; width: 96%; padding: 8px; font: inherit; }
textarea { height: 80px; }
</style>
<h1>指定经历选填验收</h1>
<p>虚构表单。在扩展“选填与复制”中框选第一条编辑区，再选择任意一条项目填入。第二条必须保持原样。</p>
<section><h2>项目经历</h2>
<article id="first">
  <label>项目名称<input name="projectName"></label>
  <label>项目描述<textarea name="projectDescription"></textarea></label>
</article>
<article id="second">
  <label>项目名称<input name="projectName" value="已有项目，请保留"></label>
  <label>项目描述<textarea name="projectDescription">已有描述，请保留</textarea></label>
</article>
</section>
</html>
