<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历配置 - AI 简历填表助手</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="resume-editor.css" />
  </head>
  <body class="resume-editor-page">
    <div class="editor-shell">
      <header class="editor-header">
        <div class="editor-header-main">
          <img class="logo-icon" src="icons/icon128.png" alt="AI 简历填表助手图标" />
          <div class="editor-header-copy">
            <h1>简历配置</h1>
            <p>在宽页面里维护标准简历，保存后会同步给侧边栏自动填充流程。</p>
          </div>
        </div>
        <div class="editor-toolbar">
          <button class="btn btn-outline" id="reloadResumeBtn">重新加载</button>
          <button class="btn btn-primary" id="saveResumeBtn">保存标准简历</button>
        </div>
      </header>

      <main class="editor-main">
        <div class="tip" id="pageStatus">正在加载标准简历...</div>

        <section class="editor-document-section">
          <div class="editor-document-copy">
            <div class="editor-document-title">便携简历文档</div>
            <div class="editor-document-desc">导出为 .airesume.json，可放入同步盘或移动硬盘并在其他电脑导入。文档不包含附件、模型配置或 API Key。</div>
          </div>
          <div class="editor-document-actions">
            <label class="document-mode-label" for="resumeDocumentImportMode">导入方式</label>
            <select id="resumeDocumentImportMode" class="document-mode-select">
              <option value="merge">合并非空字段</option>
              <option value="replace">完全替换</option>
            </select>
            <button class="btn btn-outline" id="importResumeDocumentBtn" type="button">导入文档</button>
            <button class="btn btn-outline" id="exportResumeDocumentBtn" type="button">导出文档</button>
            <input id="resumeDocumentFile" type="file" accept=".json,.airesume.json,application/json" hidden />
          </div>
        </section>

        <div class="resume-editor-layout resume-editor-layout-wide">
          <aside class="resume-nav" id="resumeNav"></aside>
          <div class="resume-form-host" id="resumeFormHost"></div>
        </div>

        <section class="editor-asset-section">
          <div class="editor-import-header">
            <div class="editor-import-header-icon">📎</div>
            <div class="editor-import-header-copy">
              <div class="editor-import-title">常用申请附件</div>
              <div class="editor-import-desc">文件仅保存在本机扩展数据库；填表时匹配个人照片、简历附件和相关作品，不会自动提交。</div>
            </div>
          </div>
          <div class="asset-grid" id="assetGrid"></div>
        </section>

        <div class="editor-import-section">
          <div class="editor-import-header">
            <div class="editor-import-header-icon">⬆</div>
            <div class="editor-import-header-copy">
              <div class="editor-import-title">导入辅助（可选）</div>
              <div class="editor-import-desc">粘贴原始简历文本或上传 PDF，用 AI 预填标准字段，导入后请检查并保存。</div>
            </div>
          </div>
          <div class="editor-import-body">
            <div class="form-group" style="margin-bottom:0">
              <label for="resumeImportText">原始简历文本</label>
              <textarea
                id="resumeImportText"
                class="textarea"
                placeholder="粘贴原始简历文本，或上传 PDF 后自动填入这里。"
              ></textarea>
            </div>
            <div class="action-row">
              <button class="btn btn-primary" id="importResumeBtn">AI 导入到标准简历</button>
              <button class="btn btn-outline" id="uploadPdfBtn">上传 PDF 并导入</button>
            </div>
          </div>
          <input type="file" id="resumePdfFile" accept="application/pdf" hidden />
        </div>
      </main>
    </div>

    <script src="libs/pdfjs/pdf.min.js"></script>
    <script src="shared/resume-schema.js"></script>
    <script src="shared/resume-storage.js"></script>
    <script src="shared/profile-document.js"></script>
    <script src="shared/asset-storage.js"></script>
    <script src="shared/model-storage.js"></script>
    <script src="shared/ai-client.js"></script>
    <script src="shared/resume-prompts.js"></script>
    <script src="resume-editor.js"></script>
  </body>
</html>
